<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện thi bằng lái C1 – 30 câu tình huống</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef3;--card:#fff;--tx:#1a232c;--mut:#566574;--ac:#0b5ea8;--ac2:#f2c230;--ok:#17803f;--okb:#e3f5ea;--no:#c0332b;--nob:#fde9e7;--bd:#cfd8e0;--ex:#fff7d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1b242d;--tx:#e8edf2;--mut:#9fb0c0;--ac:#6db3f2;--ok:#55d08a;--okb:#16352414;--no:#ff8077;--nob:#3a1d1b;--bd:#2d3a47;--ex:#2e2a14}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1b242d;--tx:#e8edf2;--mut:#9fb0c0;--ac:#6db3f2;--ok:#55d08a;--okb:#163524;--no:#ff8077;--nob:#3a1d1b;--bd:#2d3a47;--ex:#2e2a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif}
.w{max-width:620px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac2);transition:width .25s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
h1{font-size:26px;line-height:1.25;margin:0 0 10px}
h2{font-size:20px;line-height:1.3;margin:0;padding:16px 16px 12px;border-bottom:4px solid var(--ac2)}
.img svg{display:block;width:100%;height:auto;max-height:360px;background:#5c8a4d}
.q{margin:0;padding:14px 16px 8px;font-weight:600}
.os{padding:4px 16px 16px;display:grid;gap:8px}
.o{font:inherit;text-align:left;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.o:hover{border-color:var(--ac)}
.o.sel{border-color:var(--ac);background:var(--bg);font-weight:600}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.no{border-color:var(--no);background:var(--nob)}
.o:focus-visible,.b:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.ex{margin:0 16px 16px;padding:12px 14px;background:var(--ex);border-left:5px solid var(--ac2);border-radius:6px}
.ex p{margin:4px 0 0}
.nav{display:flex;gap:10px;margin-top:14px}
.b{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:10px;border:2px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
.b.g{background:transparent;color:var(--ac)}
.b:disabled{opacity:.4;cursor:default}
.mut{color:var(--mut);margin:0 0 10px}
.score{font-size:56px;font-weight:800;line-height:1.1;margin:8px 0}
.pad{padding:20px 16px}.cm{margin:12px 0;padding:12px 14px;background:var(--ex);border-left:5px solid var(--ac2);border-radius:6px}.cm p{margin:6px 0 0}.nav.col{flex-direction:column}.b small{font-weight:400;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}.g{font:inherit;font-weight:600;min-height:40px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}.g.cur{box-shadow:0 0 0 3px var(--ac2)}.g.sel{border-color:var(--ac);background:var(--bg)}.g.ok{border-color:var(--ok);background:var(--okb)}.g.no{border-color:var(--no);background:var(--nob)}.g:focus-visible{outline:3px solid var(--ac)}.sm{flex:none;padding:8px 14px;font-size:14px}.tm{font-variant-numeric:tabular-nums}.low{color:var(--no)}.ring{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--ok) var(--p),var(--bd) 0);display:grid;place-items:center;margin:8px 0}.ring span{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:34px;font-weight:800}.cover h1{font-size:28px}.cover .b{font-size:18px;padding:14px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const AR={S:[175,240,0],W:[60,175,1],N:[125,60,2],E:[240,125,3]},HV=[[0,-1],[1,0],[0,1],[-1,0]],AA="↑→↓←";
const T=(x,y,s,t,f="")=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" ${f}>${t}</text>`;
const bd=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="10" fill="#e11"/>`+T(x,y,12,n,'fill="#fff" font-weight="700"');
const SG={
noent:'<circle r="22" fill="#d32"/><rect x="-16" y="-5" width="32" height="10" fill="#fff"/>',
stop:'<polygon points="-9,-22 9,-22 22,-9 22,9 9,22 -9,22 -22,9 -22,-9" fill="#d32" stroke="#fff" stroke-width="2"/><text font-size="11" fill="#fff" text-anchor="middle" dominant-baseline="central" font-weight="700">STOP</text>',
yield:'<polygon points="-24,-18 24,-18 0,22" fill="#fff" stroke="#d32" stroke-width="6"/>',
prio:'<polygon points="0,-24 24,0 0,24 -24,0" fill="#fff" stroke="#222" stroke-width="2.5"/><polygon points="0,-16 16,0 0,16 -16,0" fill="#ffd400"/>',
warn:'<polygon points="0,-24 25,20 -25,20" fill="#ffd400" stroke="#d32" stroke-width="5"/><text y="6" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="central">!</text>'};
function draw(s){
 const b=s.b||"x",rd='fill="#454b52"';
 let o='<rect width="300" height="300" fill="#5c8a4d"/>';
 if(b=="x")o+=`<path d="M100 0h100v300H100zM0 100h300v100H0z" ${rd}/><path d="M150 0V100M150 200V300M0 150H100M200 150H300" stroke="#fff" stroke-width="3" stroke-dasharray="12 10"/><path d="M150 205H200M100 95H150M95 150V200M205 100V150" stroke="#fff" stroke-width="5"/>`;
 else{o+=`<path d="M100 0h100v300H100z" ${rd}/><path d="M150 0V300" stroke="#fff" stroke-width="3" stroke-dasharray="12 10"/>`;
  if(b=="z")for(let i=0;i<5;i++)o+=`<rect x="${105+i*20}" y="125" width="10" height="40" fill="#fff"/>`;
  if(b=="rail")o+='<rect y="125" width="300" height="40" fill="#7a6a4f"/><path d="M0 133H300M0 157H300" stroke="#ccc" stroke-width="3"/><rect x="100" y="180" width="100" height="7" fill="#e33"/><rect x="120" y="180" width="14" height="7" fill="#fff"/><rect x="160" y="180" width="14" height="7" fill="#fff"/>';}
 (s.v||[]).forEach((v,i)=>{const[x,y,h]=AR[v[0]],f=(h+{s:0,l:3,r:1}[v[2]])%4;
  o+=T(x,y,34,v[1])+bd(x-20,y-20,i+1)+T(x+HV[h][0]*36,y+HV[h][1]*36,30,AA[f],'fill="#ffd400" stroke="#000" stroke-width=".8" font-weight="700"')});
 (s.it||[]).forEach(t=>{o+=T(t[1],t[2],t[3]||34,t[0]);if(t[4])o+=bd(t[1]-20,t[2]-20,t[4])});
 if(s.sg)o+=`<g transform="translate(${s.sg[1]} ${s.sg[2]}) scale(${s.sg[3]||1})">${SG[s.sg[0]]}</g>`;
 if(s.l){const k="rygf".indexOf(s.l),c=["#e53935","#fdd835","#43a047"];k==3&&(k==3);const a=k==3?1:k;
  o+='<rect x="250" y="203" width="30" height="68" rx="6" fill="#222"/>';
  for(let i=0;i<3;i++)o+=`<circle cx="265" cy="${222+i*20}" r="8" fill="${i==a?c[i]:"#444"}"/>`;
  if(k==3)o+=T(265,284,11,"nhấp nháy",'fill="#fff"')}
 if(b=="n")o+='<rect width="300" height="300" fill="#000" opacity=".5"/>'+T(60,40,30,"🌙");
 return`<svg viewBox="0 0 300 300" role="img" aria-label="Sơ đồ tình huống">${o}</svg>`}

let Q=[
["Đèn đỏ","Xe tải của bạn (xe 1) đang tới nút giao có đèn tín hiệu màu đỏ. Bạn xử lý thế nào?",["Dừng lại trước vạch dừng","Giảm tốc rồi đi tiếp nếu không thấy xe nào","Bấm còi rồi đi qua nhanh","Chạy chậm sát vạch rồi rẽ phải"],0,"Đèn đỏ là lệnh dừng. Người lái phải dừng sau vạch dừng, không được đi tiếp. Vượt đèn đỏ bị xử phạt nặng và có thể bị trừ điểm giấy phép lái xe.",{v:[["S","🚛","s"]],l:"r"}],
["Đèn vàng","Đèn chuyển sang vàng khi xe bạn còn cách vạch dừng một đoạn an toàn. Bạn cần làm gì?",["Tăng ga để vượt qua trước khi đèn đỏ","Dừng lại trước vạch dừng","Bấm còi báo cho các xe khác","Đi tiếp như bình thường"],1,"Đèn vàng báo hiệu đèn đỏ sắp bật, người lái phải dừng trước vạch. Chỉ khi xe đã quá sát vạch mà phanh gấp sẽ gây nguy hiểm thì mới được đi tiếp, và phải quan sát kỹ.",{v:[["S","🚛","s"]],l:"y"}],
["Đèn vàng nhấp nháy","Tại nút giao có đèn vàng nhấp nháy, bạn xử lý thế nào?",["Dừng hẳn chờ đèn xanh","Giảm tốc độ, quan sát, nhường đường theo quy định rồi đi qua khi an toàn","Tăng tốc để qua nhanh","Đi bằng mọi giá vì xe tải lớn hơn"],1,"Đèn vàng nhấp nháy cho phép đi nhưng phải chú ý quan sát. Người lái giảm tốc độ, nhường đường cho người đi bộ và các xe được ưu tiên theo quy tắc rồi mới qua nút giao.",{v:[["S","🚛","s"]],l:"f"}],
["Đèn xanh và người đi bộ","Đèn xanh đã bật nhưng vẫn còn người đi bộ đang qua đường trước mũi xe. Bạn phải làm gì?",["Bấm còi để người đi bộ chạy nhanh","Giảm tốc độ, dừng lại nhường người đi bộ rồi mới đi","Lách sang bên cạnh để đi tiếp","Tăng tốc vì đang có đèn xanh"],1,"Đèn xanh cho phép xe đi nhưng không có nghĩa là được cản trở người đang qua đường. Người lái phải giảm tốc, nhường người đi bộ rồi mới tiếp tục.",{v:[["S","🚛","s"]],l:"g",it:[["🚶",150,195,30]]}],
["Rẽ phải khi đèn đỏ","Đèn đỏ đang bật, xe 1 muốn rẽ phải. Khi nào được phép rẽ?",["Luôn được rẽ nếu đường vắng","Chỉ khi có biển báo cho phép rẽ phải khi đèn đỏ, và phải nhường người đi bộ, xe khác","Chỉ cần bật xi nhan phải","Không bao giờ được rẽ, kể cả có biển cho phép"],1,"Khi đèn đỏ, xe chỉ được rẽ phải nếu có biển báo hoặc tín hiệu cho phép. Dù được phép, người lái vẫn phải quan sát và nhường người đi bộ cùng các xe đang đi đúng tín hiệu.",{v:[["S","🚛","r"]],l:"r"}],
["Hiệu lệnh của cảnh sát giao thông","Cảnh sát giao thông đứng giữa nút giao, giơ một tay thẳng đứng lên trên. Người lái xe phải làm gì?",["Tiếp tục đi thẳng","Dừng lại ở tất cả các hướng","Chỉ xe rẽ phải được đi","Chỉ xe phía sau lưng cảnh sát được đi"],1,"Tay giơ thẳng đứng là hiệu lệnh dừng ở tất cả các hướng. Hiệu lệnh của cảnh sát giao thông có giá trị cao hơn đèn tín hiệu và biển báo.",{v:[["S","🚛","s"]],it:[["👮",150,150,44]]}],
["Nhường xe đến từ bên phải (1)","Nút giao không có đèn và biển báo. Xe nào được đi trước?",["Xe 1 (ô tô con)","Xe 2 (xe tải nhỏ)","Cả hai cùng đi","Xe nào bấm còi trước"],1,"Tại nút giao không có tín hiệu và biển báo, xe phải nhường đường cho xe đến từ bên phải. Xe 2 đi tới từ bên phải của xe 1 nên xe 2 đi trước.",{v:[["S","🚗","s"],["E","🚚","s"]]}],
["Nhường xe đến từ bên phải (2)","Nút giao không có đèn và biển báo. Xe nào được đi trước?",["Xe 1 (xe tải)","Xe 2 (ô tô con)","Xe nhỏ hơn đi trước","Hai xe cùng lao vào"],0,"Xe 2 đi từ phía tây sang, bên phải của xe 2 là hướng nam, nơi xe 1 đang tới. Xe 2 phải nhường nên xe 1 đi trước.",{v:[["S","🚛","s"],["W","🚗","s"]]}],
["Hai xe đi thẳng ngược chiều","Hai xe cùng đi thẳng, đối đầu nhau ở nút giao. Điều nào đúng?",["Chỉ xe 1 được đi","Chỉ xe 2 được đi","Cả hai cùng đi thẳng được vì không cắt hướng nhau","Cả hai phải dừng"],2,"Hai xe đi thẳng ngược chiều có hướng đi không giao nhau nên không xảy ra xung đột. Tuy vậy mỗi xe vẫn phải giữ đúng làn và quan sát xung quanh.",{v:[["S","🚗","s"],["N","🚛","s"]]}],
["Rẽ trái nhường đi thẳng","Xe 1 rẽ trái, xe 2 đi thẳng từ hướng ngược lại. Xe nào được đi trước?",["Xe 1 vì đã xi nhan","Xe 2 đi thẳng","Xe tải đi trước xe con","Xe nào tới vạch trước cũng được"],1,"Xe rẽ trái phải nhường đường cho xe đi thẳng và xe rẽ phải từ hướng ngược lại. Xe 2 đi thẳng nên đi trước.",{v:[["S","🚗","l"],["N","🚛","s"]]}],
["Xe ưu tiên","Xe 2 là xe cứu thương đang bật còi và đèn ưu tiên. Bạn lái xe 1, bạn xử lý thế nào?",["Tăng tốc đi trước","Nhường đường: giảm tốc độ, tấp sát lề phải hoặc dừng để xe cứu thương đi trước","Bấm còi xin xe cứu thương nhường","Đi tiếp nếu không bị cản trở"],1,"Xe ưu tiên đang làm nhiệm vụ có tín hiệu còi, đèn thì mọi xe phải nhường. Người lái giảm tốc, đi sát bên phải hoặc dừng lại, không cản trở xe ưu tiên.",{v:[["S","🚛","s"],["W","🚑","s"]]}],
["Đường ưu tiên","Xe 1 đang đi trên đường có biển Đường ưu tiên (hình thoi vàng). Xe nào được đi trước?",["Xe 1 trên đường ưu tiên","Xe 2 vì đến từ bên phải","Cả hai nhường nhau","Xe nhỏ hơn đi trước"],0,"Xe đi trên đường ưu tiên được đi trước các xe từ đường nhánh, kể cả khi xe kia đến từ bên phải. Quy tắc nhường bên phải chỉ dùng khi không có biển báo ưu tiên.",{v:[["S","🚛","s"],["E","🚗","s"]],sg:["prio",235,262]}],
["Biển nhường đường","Xe 1 gặp biển Nhường đường (tam giác đỏ lộn ngược). Xe nào được đi trước?",["Xe 1 vì đến từ bên phải","Xe 2 trên đường giao cắt","Xe tải đi trước","Hai xe đi cùng lúc"],1,"Biển Nhường đường buộc xe phải nhường các xe trên đường giao cắt, dù xe đó đến từ bên trái. Vì vậy xe 2 đi trước.",{v:[["S","🚗","s"],["W","🚚","s"]],sg:["yield",235,262]}],
["Ba xe cùng đến nút giao","Nút giao không có đèn và biển báo, ba xe đi thẳng cùng đến. Thứ tự đi đúng là gì?",["Xe 1, xe 2, xe 3","Xe 2, xe 3, xe 1","Xe 3, xe 1, xe 2","Xe 3, xe 2, xe 1"],1,"Xe 1 nhường xe 3 đến từ bên phải. Xe 3 nhường xe 2 vì xe 2 đến từ bên phải của xe 3. Xe 2 không có xe nào bên phải nên đi trước. Thứ tự đúng là xe 2, xe 3, xe 1.",{v:[["S","🚗","s"],["N","🚛","s"],["E","🚚","s"]]}],
["Vạch đi bộ","Phía trước có người đi bộ đang qua vạch đi bộ. Bạn phải làm gì?",["Bấm còi và đi tiếp","Giảm tốc độ, dừng lại nhường đường cho người đi bộ","Vượt qua nhanh để tránh ùn tắc","Đi sát người để họ nhanh chóng tránh"],1,"Tại vạch đi bộ, xe phải giảm tốc độ và nhường đường cho người đang qua đường. Nếu cần, phải dừng hẳn trước vạch.",{b:"z",v:[["S","🚛","s"]],it:[["🚶",135,145,34],["🚶",170,145,34]]}],
["Đường ngang đường sắt","Rào chắn đã hạ xuống và chuông báo tàu sắp đến. Bạn phải làm gì?",["Lách qua rào chắn khi chưa thấy tàu","Dừng phía ngoài rào chắn, cách ray gần nhất tối thiểu 5 m, chờ tàu qua và rào mở","Tăng tốc qua nhanh","Dừng ngay trên đường ray để chờ"],1,"Tàu hỏa luôn được ưu tiên và không thể dừng gấp. Khi có rào chắn hạ hoặc chuông báo, xe phải dừng ngoài phạm vi đường sắt, tuyệt đối không được vượt rào hoặc đỗ trên đường ray.",{b:"rail",v:[["S","🚛","s"]],it:[["🚆",70,145,44]]}],
["Vượt xe","Xe 1 muốn vượt xe 2 phía trước. Điều nào đúng?",["Vượt ngay, không cần báo hiệu","Báo hiệu xin vượt bằng đèn hoặc còi, chỉ vượt khi phía trước đủ rộng, không có xe ngược chiều","Vượt bên phải khi xe trước đang rẽ trái","Vượt ở chỗ đường cong khuất tầm nhìn"],1,"Muốn vượt, người lái phải có tín hiệu xin vượt và chỉ vượt khi đường phía trước đủ rộng, không có xe ngược chiều và xe trước không có ý định vượt. Cấm vượt ở đường cong, đỉnh dốc và nơi khuất tầm nhìn.",{b:"v",it:[["🚗",175,230,34,1],["🚛",175,150,34,2]]}],
